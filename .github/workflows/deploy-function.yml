name: Deploy Azure Function

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: asset-availability-api

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AssetAvailabilityFunction/AssetAvailabilityFunction/AssetAvailabilityFunction.csproj

      - name: Build
        run: dotnet build AssetAvailabilityFunction/AssetAvailabilityFunction/AssetAvailabilityFunction.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AssetAvailabilityFunction/AssetAvailabilityFunction/AssetAvailabilityFunction.csproj --configuration Release --no-build --output ./function-output

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./function-output
